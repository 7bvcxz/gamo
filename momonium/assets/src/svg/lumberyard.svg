<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="140" height="150">
  <!-- A 1x1 lumberyard in the tile projection (diamond centre = origin pivot
       at (70, 95)): a grown tree, a stump with an axe, a stack of logs and a
       young sapling -- fell one, plant one. -->
  <path d="M70 60 L122 96 L70 132 L18 96 Z" fill="#9ccf6e" stroke="#6f9f45" stroke-width="2" stroke-linejoin="round"/>
  <!-- the grown tree -->
  <rect x="38" y="62" width="9" height="30" rx="3" fill="#8a5a34"/>
  <circle cx="42" cy="50" r="20" fill="#4f9a45"/>
  <circle cx="32" cy="58" r="13" fill="#5aab4f"/>
  <circle cx="53" cy="40" r="12" fill="#66b85a"/>
  <!-- log stack -->
  <g stroke="#6b4426" stroke-width="2">
    <path d="M70 116 L104 96 L104 104 L70 124 Z" fill="#b07a46"/>
    <path d="M74 106 L108 86 L108 94 L74 114 Z" fill="#c88f55"/>
  </g>
  <g fill="#e2b98a" stroke="#6b4426" stroke-width="2">
    <ellipse cx="70" cy="120" rx="5" ry="6"/>
    <ellipse cx="80" cy="114" rx="5" ry="6"/>
    <ellipse cx="74" cy="110" rx="5" ry="6"/>
  </g>
  <!-- stump with an axe -->
  <ellipse cx="96" cy="78" rx="11" ry="6" fill="#e2b98a" stroke="#6b4426" stroke-width="2"/>
  <path d="M85 78 L85 86 Q96 92 107 86 L107 78" fill="#a8723f" stroke="#6b4426" stroke-width="2"/>
  <path d="M96 76 L104 60" stroke="#8a5a34" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M100 62 L110 58 L108 68 Z" fill="#c9d3dd" stroke="#6f7b87" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- sapling -->
  <path d="M52 110 L52 98" stroke="#6f9f45" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M52 100 Q44 94 46 90 Q52 92 52 100 Q56 90 62 92 Q60 98 52 100" fill="#7cc35a" stroke="#4f8a3a" stroke-width="1.2"/>
</svg>

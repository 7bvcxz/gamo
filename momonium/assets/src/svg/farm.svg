<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130" width="140" height="130">
  <!-- A 1x1 farm plot in the tile projection (128x98 diamond, centre = origin
       pivot at (70, 55)): tilled soil with rows inside a low wooden fence. -->
  <defs>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="1" stop-color="#6b4226"/>
    </linearGradient>
  </defs>
  <!-- soil bed, a little inside the tile -->
  <path d="M70 16 L122 55 L70 94 L18 55 Z" fill="url(#soil)" stroke="#5a3820" stroke-width="2" stroke-linejoin="round"/>
  <!-- furrows running along the tile's x axis -->
  <g stroke="#4f311b" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <path d="M57 26 L105 62"/>
    <path d="M44 36 L92 72"/>
    <path d="M31 46 L79 82"/>
  </g>
  <g stroke="#a87a4f" stroke-width="1.6" stroke-linecap="round" opacity="0.7">
    <path d="M60 24 L108 60"/>
    <path d="M47 34 L95 70"/>
    <path d="M34 44 L82 80"/>
  </g>
  <!-- fence: rails on the two near edges, posts at corners and middles -->
  <g stroke="#6b4426" stroke-width="2" stroke-linejoin="round">
    <path d="M14 55 L70 97 L126 55" fill="none" stroke="#b07a46" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 48 L70 90 L126 48" fill="none" stroke="#c88f55" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="10" y="44" width="8" height="16" rx="2" fill="#a8723f"/>
    <rect x="66" y="86" width="8" height="16" rx="2" fill="#a8723f"/>
    <rect x="122" y="44" width="8" height="16" rx="2" fill="#a8723f"/>
    <rect x="38" y="65" width="7" height="14" rx="2" fill="#a8723f"/>
    <rect x="95" y="65" width="7" height="14" rx="2" fill="#a8723f"/>
    <rect x="66" y="8" width="8" height="14" rx="2" fill="#a8723f"/>
  </g>
</svg>

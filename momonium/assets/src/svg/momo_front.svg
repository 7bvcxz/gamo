<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Momo, front three-quarter, standing. Origin pivot (feet centre) is (100, 212).
       White floppy ears, small hair tuft, brown eyes, pink cheeks,
       cream overalls with a stitched front pocket. -->
  <g stroke="#61504f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs -->
    <path d="M74 176 Q72 207 86 208 Q97 208 96 190 Z" fill="#fffcf4"/>
    <path d="M126 176 Q128 207 114 208 Q103 208 104 190 Z" fill="#fffcf4"/>
    <!-- overalls: trousers and bib -->
    <path d="M64 132 Q60 170 72 186 Q86 194 100 188 Q114 194 128 186 Q140 170 136 132 Z" fill="#f4dec5"/>
    <path d="M100 160 L100 188" fill="none" stroke-width="2.4"/>
    <!-- arms -->
    <path d="M66 126 Q46 134 48 156 Q52 166 62 160 Q68 146 72 136 Z" fill="#fffcf4"/>
    <path d="M134 126 Q154 134 152 156 Q148 166 138 160 Q132 146 128 136 Z" fill="#fffcf4"/>
    <!-- bib with stitched pocket -->
    <path d="M76 122 L124 122 L126 158 Q100 164 74 158 Z" fill="#f4dec5"/>
    <rect x="86" y="132" width="28" height="20" rx="4" fill="#efd5b6" stroke-width="2.4"/>
    <rect x="89.5" y="135.5" width="21" height="13" rx="3" fill="none" stroke="#c9a37f" stroke-width="1.4" stroke-dasharray="3 2.4"/>
    <!-- straps and buttons -->
    <path d="M76 124 L70 112" fill="none" stroke-width="7" stroke="#61504f"/>
    <path d="M76 124 L70 112" fill="none" stroke-width="3.6" stroke="#f4dec5"/>
    <path d="M124 124 L130 112" fill="none" stroke-width="7" stroke="#61504f"/>
    <path d="M124 124 L130 112" fill="none" stroke-width="3.6" stroke="#f4dec5"/>
    <circle cx="80" cy="127" r="5" fill="#d19363" stroke-width="2.2"/>
    <circle cx="120" cy="127" r="5" fill="#d19363" stroke-width="2.2"/>
    <!-- head -->
    <path d="M100 30 C150 30 164 62 162 84 C160 112 132 124 100 124 C68 124 40 112 38 84 C36 62 50 30 100 30 Z" fill="#fffcf4"/>
    <!-- tuft -->
    <path d="M94 32 C90 18 102 12 108 18 C104 18 100 22 104 30" fill="#fffcf4" stroke-width="2.6"/>
    <!-- floppy ears, hanging over the sides of the head -->
    <path d="M58 46 C34 46 14 72 16 104 C17 126 30 134 40 128 C52 120 50 96 56 80 C60 68 70 56 58 46 Z" fill="#fffcf4"/>
    <path d="M142 46 C166 46 186 72 184 104 C183 126 170 134 160 128 C148 120 150 96 144 80 C140 68 130 56 142 46 Z" fill="#fffcf4"/>
  </g>
  <!-- ear shading (no stroke) -->
  <path d="M30 110 C30 92 38 76 50 66 C44 82 42 100 40 120 Z" fill="#ebe3da"/>
  <path d="M170 110 C170 92 162 76 150 66 C156 82 158 100 160 120 Z" fill="#ebe3da"/>
  <!-- face -->
  <ellipse cx="80" cy="84" rx="7.5" ry="9.5" fill="#3b2620"/>
  <ellipse cx="120" cy="84" rx="7.5" ry="9.5" fill="#3b2620"/>
  <circle cx="82.5" cy="80" r="3" fill="#ffffff"/>
  <circle cx="122.5" cy="80" r="3" fill="#ffffff"/>
  <circle cx="78" cy="89" r="1.4" fill="#ffffff" opacity="0.8"/>
  <circle cx="118" cy="89" r="1.4" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="66" cy="100" rx="9" ry="5.6" fill="#ffb7b0" opacity="0.9"/>
  <ellipse cx="134" cy="100" rx="9" ry="5.6" fill="#ffb7b0" opacity="0.9"/>
  <path d="M92 97 Q100 112 108 97 Z" fill="#c9504f" stroke="#61504f" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M95 103 Q100 108 105 103 Q100 100 95 103 Z" fill="#ff8f8a"/>
</svg>

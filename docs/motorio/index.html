<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading game</title>
  <style>
    html, body { height: 100%; margin: 0; background: #09110e; color: #dce9df; }
    body { display: grid; place-items: center; font: 14px sans-serif; }
  </style>
</head>
<body>
  <span>Loading...</span>
  <!--
    The build this page was published with, written in at deploy time.

    This used to ask api.github.com which build was current, to get around Pages
    caching the manifest for ten minutes. That put a rate-limited third party on
    the critical path of every single load: sixty requests an hour per IP, shared
    across everyone behind the same carrier NAT, and when it runs out the answer
    is a 403 and the game does not start at all. Ten minutes of staleness is
    invisible to a player; a game that refuses to open is not.

    Staying correct without asking: the pack name below is content-hashed, deploy
    keeps the previous build, and if a cached copy of this page ever does point
    at a pack that is gone, the runner resolves the current one itself.
  -->
  <script>
    const params = new URLSearchParams(location.search);
    const target = new URL("runner-v2.html", location.href);
    target.searchParams.set("pack", "game-52f668a42d2f.pck");
    target.searchParams.set("size", "2902972");
    target.searchParams.set("build", "game-52f668a42d2f.pck");
    // Anything already on the address survives the hop, so a link with its own
    // query string is not silently dropped on the way through.
    for (const [key, value] of params) {
      if (!target.searchParams.has(key)) target.searchParams.set(key, value);
    }
    location.replace(target);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motorio 설계 문서</title>
<style>
  :root {
    --bg: #0f1417; --panel: #151d21; --line: #2a3a40; --text: #dfe8e6;
    --muted: #8fa5a2; --accent: #6fd2c8; --brass: #d7a84c; --code: #101819;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f7f7; --panel: #ffffff; --line: #d5e0e0; --text: #1a2426;
      --muted: #5d7273; --accent: #17847a; --brass: #9a7420; --code: #eef3f3;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    line-height: 1.75; font-size: 16px;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    border-bottom: 1px solid var(--line); padding: 14px 20px 0;
  }
  h1.site { margin: 0 0 4px; font-size: 17px; letter-spacing: .2px; }
  .meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; }
  nav button {
    background: transparent; color: var(--muted); border: 1px solid transparent;
    border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer;
    font-size: 14px; font-family: inherit; border-radius: 8px 8px 0 0;
  }
  nav button:hover { color: var(--text); }
  nav button[aria-selected="true"] {
    color: var(--accent); border-bottom-color: var(--accent); font-weight: 600;
  }
  main { max-width: 860px; margin: 0 auto; padding: 28px 20px 90px; }
  h1, h2, h3 { line-height: 1.35; }
  h1 { font-size: 26px; margin: 0 0 18px; }
  h2 {
    font-size: 20px; margin: 34px 0 12px; padding-bottom: 7px;
    border-bottom: 1px solid var(--line);
  }
  h3 { font-size: 16px; margin: 22px 0 8px; color: var(--accent); }
  p { margin: 12px 0; }
  ul, ol { padding-left: 22px; }
  li { margin: 6px 0; }
  code {
    background: var(--code); padding: 2px 6px; border-radius: 5px;
    font-size: .89em; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  pre {
    background: var(--code); padding: 14px 16px; border-radius: 10px;
    overflow-x: auto; border: 1px solid var(--line);
  }
  pre code { background: none; padding: 0; font-size: .85em; line-height: 1.5; }
  blockquote {
    margin: 14px 0; padding: 10px 16px; border-left: 3px solid var(--brass);
    background: rgba(215,168,76,.09); border-radius: 0 8px 8px 0; color: var(--text);
  }
  blockquote p { margin: 6px 0; }
  .table-wrap { overflow-x: auto; margin: 16px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 8px 11px; text-align: left; }
  th { background: var(--panel); font-weight: 600; }
  hr { border: none; border-top: 1px solid var(--line); margin: 28px 0; }
  a { color: var(--accent); }
  .tag { font-weight: 700; border-radius: 5px; padding: 1px 6px; font-size: .82em; }
  .tag-fixed { background: rgba(111,210,200,.18); color: var(--accent); }
  .tag-draft { background: rgba(215,168,76,.18); color: var(--brass); }
  .tag-question { background: rgba(233,109,109,.18); color: #e96d6d; }
  .status { color: var(--muted); padding: 40px 0; text-align: center; }
  .error { color: #e96d6d; }
</style>
</head>
<body>
<header>
  <h1 class="site">Motorio 설계 문서</h1>
  <div class="meta" id="meta">불러오는 중…</div>
  <nav id="nav"></nav>
</header>
<main id="content"><div class="status">불러오는 중…</div></main>

<script>
const REPO = "7bvcxz/gamo";
const BRANCH = "main";
const DOCS = [
  { id: "identity",   label: "게임 정체성",   path: "motorio/design/01-identity.md" },
  { id: "level",      label: "레벨 디자인",   path: "motorio/design/02-level-design.md" },
  { id: "automation", label: "자동화 디자인", path: "motorio/design/03-automation-design.md" },
  { id: "ref-satisfactory", label: "레퍼런스: Satisfactory", path: "motorio/design/04-ref-satisfactory-level-design.md" }
];

// GitHub Pages caches responses on its CDN for several minutes, so reading the
// markdown through the repository API instead keeps a plain refresh honest.
async function fetchDoc(path) {
  const bust = Date.now();
  const api = `https://api.github.com/repos/${REPO}/contents/${path}?ref=${BRANCH}&_=${bust}`;
  try {
    const res = await fetch(api, {
      cache: "no-store",
      headers: { Accept: "application/vnd.github.raw" }
    });
    if (res.ok) return await res.text();
  } catch (e) { /* fall through to raw host */ }
  const raw = `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}?_=${bust}`;
  const res2 = await fetch(raw, { cache: "no-store" });
  if (!res2.ok) throw new Error(`문서를 불러오지 못했습니다 (${res2.status})`);
  return await res2.text();
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function inline(s) {
  let out = escapeHtml(s);
  out = out.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  out = out.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  out = out.replace(/\[확정\]/g, '<span class="tag tag-fixed">확정</span>');
  out = out.replace(/\[초안\]/g, '<span class="tag tag-draft">초안</span>');
  out = out.replace(/\[질문\]/g, '<span class="tag tag-question">질문</span>');
  return out;
}

function splitRow(line) {
  return line.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
}

// A small renderer keeps this page dependency-free, which matters because the
// repository rule is that nothing here may rely on an external CDN.
function renderMarkdown(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const html = [];
  let i = 0;
  let listType = null;

  const closeList = () => {
    if (listType) { html.push(`</${listType}>`); listType = null; }
  };

  while (i < lines.length) {
    const line = lines[i];

    if (line.startsWith("```")) {
      closeList();
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) { buf.push(lines[i]); i++; }
      i++;
      html.push(`<pre><code>${escapeHtml(buf.join("\n"))}</code></pre>`);
      continue;
    }

    if (/^\|.*\|/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|$/.test(lines[i + 1])) {
      closeList();
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|.*\|/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
      html.push('<div class="table-wrap"><table><thead><tr>' +
        head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>");
      continue;
    }

    if (/^>\s?/.test(line)) {
      closeList();
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++; }
      html.push(`<blockquote>${renderMarkdown(buf.join("\n"))}</blockquote>`);
      continue;
    }

    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (heading) {
      closeList();
      const level = heading[1].length;
      html.push(`<h${level}>${inline(heading[2])}</h${level}>`);
      i++;
      continue;
    }

    if (/^(-{3,}|\*{3,})$/.test(line.trim())) {
      closeList(); html.push("<hr>"); i++; continue;
    }

    const ul = line.match(/^\s*[-*]\s+(.*)$/);
    const ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if (ul || ol) {
      const want = ul ? "ul" : "ol";
      if (listType !== want) { closeList(); html.push(`<${want}>`); listType = want; }
      html.push(`<li>${inline((ul || ol)[1])}</li>`);
      i++;
      continue;
    }

    if (line.trim() === "") { closeList(); i++; continue; }

    closeList();
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== "" && !/^(#{1,4}\s|>|\||```|\s*[-*]\s|\s*\d+\.\s)/.test(lines[i])) {
      buf.push(lines[i]); i++;
    }
    html.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  closeList();
  return html.join("\n");
}

const cache = {};
let current = null;

async function show(id) {
  current = id;
  location.hash = id;
  for (const btn of document.querySelectorAll("#nav button")) {
    btn.setAttribute("aria-selected", String(btn.dataset.id === id));
  }
  const doc = DOCS.find(d => d.id === id);
  const content = document.getElementById("content");
  content.innerHTML = '<div class="status">불러오는 중…</div>';
  try {
    if (!cache[id]) cache[id] = await fetchDoc(doc.path);
    if (current !== id) return;
    content.innerHTML = renderMarkdown(cache[id]);
    document.getElementById("meta").textContent =
      `${doc.path} · 새로고침하면 항상 최신 커밋을 읽습니다 · 확인 ${new Date().toLocaleString("ko-KR")}`;
  } catch (err) {
    content.innerHTML = `<div class="status error">${escapeHtml(err.message)}</div>`;
  }
}

const nav = document.getElementById("nav");
for (const doc of DOCS) {
  const btn = document.createElement("button");
  btn.textContent = doc.label;
  btn.dataset.id = doc.id;
  btn.onclick = () => show(doc.id);
  nav.appendChild(btn);
}

const initial = DOCS.some(d => d.id === location.hash.slice(1))
  ? location.hash.slice(1) : DOCS[0].id;
show(initial);
</script>
</body>
</html>

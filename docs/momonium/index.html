  <title>momonium</title>
  <!--
    Momonium's own index page (Step 62): the loading screen from the first
    paint, then on to the runner, which shows the same screen until the island
    has drawn. tools/deploy.sh copies web/shell.html's splash block in place of
    the marker below and writes the build's pack name and size, as
    deploy-web.sh does for the shared web-index-loader.html (whose comments say
    why this page names the build instead of asking an API for it).
  -->
  <style>
    html, body { height: 100%; margin: 0; background: #1d86c4; }
  </style>
  <style>
#momo-splash {
	position: fixed;
	inset: 0;
	z-index: 5;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	padding: 24px;
	box-sizing: border-box;
	overflow: hidden;
	color: #ffffff;
	text-align: center;
	background: linear-gradient(180deg, #9be3f4 0%, #4cbde8 42%, #2a9fd6 72%, #1d86c4 100%);
	font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
	transition: opacity 0.45s ease;
	-webkit-user-select: none;
	user-select: none;
}

#momo-splash.done {
	opacity: 0;
	pointer-events: none;
}

/* Light on the water, drifting: two sheets of soft highlights. */
#momo-splash .sea, #momo-splash .sea::after {
	position: absolute;
	inset: -20%;
	content: "";
	pointer-events: none;
	background-image:
		radial-gradient(ellipse 18px 3px at 20% 30%, rgba(255, 255, 255, 0.55), transparent 70%),
		radial-gradient(ellipse 26px 4px at 70% 60%, rgba(255, 255, 255, 0.45), transparent 70%),
		radial-gradient(ellipse 14px 2px at 45% 85%, rgba(255, 255, 255, 0.5), transparent 70%),
		radial-gradient(ellipse 22px 3px at 85% 15%, rgba(255, 255, 255, 0.4), transparent 70%);
	background-size: 180px 140px;
	animation: momo-drift 18s linear infinite;
	opacity: 0.8;
}

#momo-splash .sea::after {
	inset: 0;
	background-size: 260px 210px;
	animation-duration: 27s;
	animation-direction: reverse;
	opacity: 0.6;
}

#momo-splash .float {
	position: relative;
	width: 132px;
	height: 150px;
}

#momo-splash .ripple {
	position: absolute;
	left: 50%;
	bottom: 4px;
	width: 120px;
	height: 18px;
	margin-left: -60px;
	border-radius: 50%;
	background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.15) 62%, transparent 72%);
	animation: momo-ripple 3.2s ease-in-out infinite;
}

#momo-splash .word {
	font-size: clamp(30px, 8vw, 46px);
	font-weight: 800;
	letter-spacing: 0.04em;
	line-height: 1;
	text-shadow: 0 2px 0 rgba(10, 60, 110, 0.22);
}

#momo-splash .line {
	font-size: 15px;
	opacity: 0.94;
	min-height: 1.4em;
	text-shadow: 0 1px 2px rgba(10, 60, 110, 0.35);
}

#momo-splash .dots i {
	font-style: normal;
	animation: momo-dot 1.4s ease-in-out infinite;
}

#momo-splash .dots i:nth-child(2) {
	animation-delay: 0.2s;
}

#momo-splash .dots i:nth-child(3) {
	animation-delay: 0.4s;
}

#momo-splash .bar {
	position: relative;
	width: min(56vw, 240px);
	height: 4px;
	border-radius: 2px;
	overflow: hidden;
	background: rgba(255, 255, 255, 0.3);
}

#momo-splash .bar i {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0;
	border-radius: 2px;
	background: #ffffff;
	/* Step 74: no easing -- the bar is the number shown, at once (an easing
	   bar was still sliding back from the last phase while the next phase's
	   7% was already on the line). The loader reports every frame. */
}

/* Nothing measured yet: a short light travelling, not a made-up percentage. */
#momo-splash .bar.unknown i {
	width: 32%;
	animation: momo-travel 1.5s ease-in-out infinite;
}

#momo-splash .notice {
	display: none;
	max-width: 22rem;
	margin: 0 auto;
	padding: 14px 16px;
	border-radius: 14px;
	background: rgba(8, 40, 78, 0.78);
	font-size: 14px;
	line-height: 1.45;
	white-space: pre-line;
}

#momo-splash.failed .notice, #momo-splash.slow .notice {
	display: block;
}

/* Step 74: after loading, a small note of how long it took, over the game:
   taps go through it, and it leaves by itself. */
#momo-loaded {
	position: fixed;
	left: 50%;
	bottom: max(18px, env(safe-area-inset-bottom));
	z-index: 6;
	transform: translateX(-50%);
	padding: 7px 14px;
	border-radius: 16px;
	background: rgba(8, 40, 78, 0.72);

<body>
  <div id="momo-splash" role="status" aria-live="polite" aria-busy="true">
			<div class="sea" aria-hidden="true"></div>
			<div class="float" aria-hidden="true"><div class="ripple"></div><div class="momo"></div></div>
			<div class="word">momonium</div>
			<div class="line"><span class="text"></span><span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></div>
			<div class="bar unknown" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
			<div class="notice"><span class="why"></span><br><button class="retry" type="button"></button></div>

		<script>
/* The loading screen's words in the player's language, and what it shows.
   Step 74: the real share of the bytes of the download under way, phase by
   phase -- the engine, then the island (the runner reports the phases) --
   measured by Godot's own loader (`progress`); while a phase's size is not
   known, or its download is done and the engine is busy with it, a phase
   name and a travelling light instead of a number. Never a made-up
   percentage, never 100% while the game is still blocked. Once the island
   has drawn (window.momonium.ready, a few frames later) it fades into the
   game, and a small note says how long it took -- measured with the
   monotonic clock from the first page (the index passes its start, `t0`). */
window.MomoSplash = (function () {
	const words = {
		en: { line: 'Getting the island ready', load: ['Loading {p}%', 'Loading the engine {p}%', 'Loading the island {p}%'], busy: ['Getting the island ready', 'Preparing the engine', 'Opening the island', 'Waking the Momo'],
			loaded: 'Loaded in {s} s', fail: 'The island could not open.', slow: 'This is taking longer than usual.', retry: 'Try again' },
		ko: { line: '섬을 준비하고 있어요', load: ['불러오는 중 {p}%', '엔진을 불러오는 중 {p}%', '섬을 불러오는 중 {p}%'], busy: ['섬을 준비하고 있어요', '엔진을 준비하는 중', '섬을 여는 중', '모모를 깨우는 중'],
			loaded: '{s}초 만에 열렸어요', fail: '섬을 열지 못했어요.', slow: '평소보다 오래 걸리고 있어요.', retry: '다시 시도' },
		ja: { line: '島を準備しています', load: ['読み込み中 {p}%', 'エンジンを読み込み中 {p}%', '島を読み込み中 {p}%'], busy: ['島を準備しています', 'エンジンを準備中', '島を開いています', 'モモを起こしています'],
			loaded: '{s}秒で読み込みました', fail: '島を開けませんでした。', slow: 'いつもより時間がかかっています。', retry: 'もう一度' },
		zh: { line: '正在准备岛屿', load: ['正在加载 {p}%', '正在加载引擎 {p}%', '正在加载岛屿 {p}%'], busy: ['正在准备岛屿', '正在准备引擎', '正在打开岛屿', '正在叫醒桃桃'],
			loaded: '加载用时 {s} 秒', fail: '无法打开岛屿。', slow: '加载时间比平时长。', retry: '重试' },
	};

	const w = words[lang] || words.en;
	const root = document.getElementById('momo-splash');
	if (!root) {
		return null;
	}
	document.documentElement.lang = words[lang] ? lang : 'en';
	const text = root.querySelector('.text');
	const dots = root.querySelector('.dots');
	const bar = root.querySelector('.bar');
	const fill = bar.querySelector('i');
	text.textContent = w.line;
	root.querySelector('.retry').textContent = w.retry;
	root.querySelector('.retry').addEventListener('click', function () { location.reload(); });
	/* Where the clock starts: the first page's start when the index passed it
	   (and it is plausible), else this page's own. */
	const t0 = Number(new URLSearchParams(location.search).get('t0')) || 0;
	const fromPage = t0 > 0 && t0 <= performance.timeOrigin && performance.timeOrigin - t0 < 120000 ? performance.timeOrigin - t0 : 0;
	const now = function () { return fromPage + performance.now(); };
	let gone = false;
	/* The bytes Godot's loader has counted at the start of this phase, so a
	   phase shows its own download only (the next file's size joins the
	   total when it starts). */
	let base = { loaded: 0, total: 0 };
	let last = { loaded: 0, total: 0 };
	/* The highest share shown in this phase: a number never goes back. */
	let high = 0;
	const api = {
		stage: 0,
		state: 'loading',
		percent: -1,
		label: w.line,
		/* What the screen said, in order: [ms, label, percent or -1] (tests,
		   and the evidence of a real load). */
		history: [],
		timings: { phases: [], total_ms: -1, from_first_page: fromPage > 0 },
		show: function (label, percent) {
			if (label === api.label && percent === api.percent) {
				return;
			}
			api.label = label;
			api.percent = percent;
			text.textContent = label;
			dots.style.display = percent >= 0 ? 'none' : '';
			if (percent >= 0) {
				bar.classList.remove('unknown');
				fill.style.width = percent + '%';
				bar.setAttribute('aria-valuenow', String(percent));
			} else {
				bar.classList.add('unknown');
				fill.style.width = '';
				bar.removeAttribute('aria-valuenow');
			}
			api.history.push([Math.round(now()), label, percent]);
		},
		/* Stage n of 3 reached (1 engine, 2 game files, 3 starting): the
		   runner's own phases. */
		step: function (n) {
			const stage = Math.max(api.stage, Math.min(n, 3));
			if (stage === api.stage) {
				return;
			}
			const t = now();
			const open = api.timings.phases[api.timings.phases.length - 1];
			if (open && open.end_ms < 0) {
				open.end_ms = Math.round(t);
			}
			api.stage = stage;
			api.timings.phases.push({ phase: ['', 'engine', 'island', 'start'][stage], start_ms: Math.round(t), download_ms: -1, end_ms: -1, bytes: 0 });
			base = { loaded: last.loaded, total: last.total };
			high = 0;
			api.show(w.busy[stage] || w.line, -1);
		},
		/* Bytes Godot's loader counted (all files so far, and their total
		   when every size is known). */
		progress: function (loaded, total) {
			last = { loaded: loaded, total: total };
			if (api.state !== 'loading' || api.stage >= 3) {
				return;
			}
			api.phaseBytes(loaded - base.loaded, total > 0 ? total - base.total : 0);
		},
		/* The game files' own bytes, counted on their way in (below): the
		   runner fetches them after the engine, when Godot's loader no
		   longer reports. Only the game files' phase listens. */
		fileBytes: function (loaded, size) {
			if (api.stage === 2 && api.state === 'loading') {
				api.phaseBytes(loaded, size);
			}
		},
		/* This phase's bytes: a share, or its name while there is no size or
		   the download is done and the engine is busy with it. */
		phaseBytes: function (own, size) {
			const phase = api.timings.phases[api.timings.phases.length - 1];
			if (size <= 0) {
				/* No size to measure against: the phase's name, no number. */
				api.show(w.busy[api.stage] || w.line, -1);
				return;
			}
			if (own >= size) {
				/* Downloaded; the engine is busy with it -- not done yet. */
				if (phase && phase.download_ms < 0) {
					phase.download_ms = Math.round(now() - phase.start_ms);
					phase.bytes = size;
				}
				api.show(w.busy[api.stage] || w.line, -1);
				return;
			}
			high = Math.max(high, Math.max(0, Math.min(99, Math.floor((own / size) * 100))));
			api.show(w.load[api.stage].replace('{p}', high), high);
		},
		/* Kept for Godot's own start callback (the plain export). */
		bytes: function (current, total) {
			api.progress(current, total);
		},
		fail: function (why) {
			if (api.state === 'done' || api.state === 'failed') {
				return;
			}
			api.state = 'failed';
			root.classList.add('failed');
			root.setAttribute('aria-busy', 'false');
			root.querySelector('.why').textContent = w.fail + (why ? '\n' + why : '');
			api.history.push([Math.round(now()), 'failed', -1]);
		},
		/* The engine started: wait for the island's first frame, then fade. */
		started: function () {
			if (api.state !== 'loading') {
				return;
			}
			api.state = 'starting';
			if (api.stage < 3) {
				api.step(3);
			}
			const t1 = Date.now();
			const wait = function () {
				const ready = window.momonium && window.momonium.ready;
				if (!ready && Date.now() - t1 < 8000) {
					requestAnimationFrame(wait);
					return;
				}
				/* A few frames for the first picture to reach the screen. */
				let frames = 3;
				const settle = function () {
					if (--frames > 0) {
						requestAnimationFrame(settle);
						return;
					}
					api.loaded();
					api.hide();
				};
				requestAnimationFrame(settle);
			};
			wait();
		},
		/* The island is on the screen: how long that took, said once. */
		loaded: function () {
			const t = now();
			const open = api.timings.phases[api.timings.phases.length - 1];
			if (open && open.end_ms < 0) {
				open.end_ms = Math.round(t);
			}
			api.timings.total_ms = Math.round(t);
			const seconds = (t / 1000).toFixed(1);
			console.info('[momonium] loaded in ' + seconds + ' s', JSON.stringify(api.timings));
			const note = document.createElement('div');
			note.id = 'momo-loaded';
			note.setAttribute('role', 'status');
			note.textContent = w.loaded.replace('{s}', seconds);
			document.body.appendChild(note);
			api.note = note.textContent;
			setTimeout(function () {
				note.classList.add('gone');
				setTimeout(function () {
					if (note.parentNode) {
						note.parentNode.removeChild(note);
					}
				}, 600);
			}, 1600);
		},
		hide: function () {
			if (gone) {
				return;
			}
			gone = true;
			api.state = 'done';
			root.setAttribute('aria-busy', 'false');
			root.classList.add('done');
			const remove = function () {
				if (root.parentNode) {
					root.parentNode.removeChild(root);
				}
				const canvas = document.getElementById('canvas');
				if (canvas) {
					canvas.focus();
				}
			};
			root.addEventListener('transitionend', remove, { once: true });
			setTimeout(remove, 700);
		},
	};
	/* Godot's loader retries a download, then throws where no promise of
	   the shell's hears it (a failed engine fetch left the screen loading
	   for good): while loading, an uncaught error is the failure. */
	window.addEventListener('unhandledrejection', function (e) {
		if (api.state === 'loading') {
			const r = e.reason;
			api.fail(r && r.message ? r.message : String(r || ''));
		}
	});
	window.addEventListener('error', function (e) {
		if (api.state === 'loading' && e.message) {
			api.fail(e.message);
		}
	});
	/* The runner fetches the game files (.pck) after the engine, when
	   Godot's own progress loop has already stopped (it runs only while the
	   engine downloads): count that download's bytes on their way in, and
	   hand the same bytes on to Godot. Nothing else is touched. */
	if (window.fetch && window.ReadableStream) {
		const plainFetch = window.fetch.bind(window);
		window.fetch = function (input, init) {
			const url = typeof input === 'string' ? input : String((input && input.url) || '');
			const method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
			const pending = plainFetch(input, init);
			if (method !== 'GET' || !/\.pck(\?|$)/.test(url)) {
				return pending;
			}
			return pending.then(function (response) {
				if (!response.ok || !response.body) {
					return response;
				}

				const plain = !response.headers.get('content-encoding');
				const size = Number(sizes[url] || sizes[name] || (plain ? response.headers.get('content-length') : 0)) || 0;
				const reader = response.body.getReader();
				let loaded = 0;
				const counted = new ReadableStream({
					pull: function (controller) {
						return reader.read().then(function (part) {
							if (part.done) {
								controller.close();
								return;
							}
							loaded += part.value.byteLength;
							api.fileBytes(loaded, size);
							controller.enqueue(part.value);
						});
					},
					cancel: function (reason) {
						return reader.cancel(reason);
					},
				});
				return new Response(counted, { status: response.status, statusText: response.statusText, headers: response.headers });
			});
		};
	}
	/* Still loading after a minute: say so, and offer to start over (the
	   load goes on meanwhile). */
	setTimeout(function () {
		if (api.state === 'loading') {
			root.classList.add('slow');
			root.querySelector('.why').textContent = w.slow;
		}
	}, 60000);
	return api;
}());

  <script>

<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="theme-color" content="#2a9fd6">
		<title>momonium</title>
		<!--
			Momonium's web shell (Step 62): Godot's own shell (godot.html of the
			4.7 web templates) with a Momonium loading screen over it from the
			first paint until the island has drawn its first frame. The script
			lines deploy-web.sh rewrites for the runner -- where the engine is
			created, where the game is started, the promise that follows and
			the line that hides the status overlay -- are kept exactly as Godot
			wrote them (and are named nowhere else in this file: its sed would
			rewrite a comment that quoted them too).
			The splash block between the splash markers is also copied into the
			index page (web/index-loader.html) by tools/deploy.sh, so the page
			before the runner looks the same.
		-->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html {
	background: #1d86c4;
}

body {
	color: white;
	background-color: #1d86c4;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

/* Godot's own status overlay: its splash and bar give way to Momonium's. */
#status {
	position: absolute;
	inset: 0;
	visibility: hidden;
	pointer-events: none;
}

#status-splash, #status-progress, #status-notice {
	display: none !important;
}
		</style>
		<!--splash:begin-->
		<style>
#momo-splash {
	position: fixed;
	inset: 0;
	z-index: 5;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 14px;
	padding: 24px;
	box-sizing: border-box;
	overflow: hidden;
	color: #ffffff;
	text-align: center;
	background: linear-gradient(180deg, #9be3f4 0%, #4cbde8 42%, #2a9fd6 72%, #1d86c4 100%);
	font-family: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Arial Rounded MT Bold", system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
	transition: opacity 0.45s ease;
	-webkit-user-select: none;
	user-select: none;
}

#momo-splash.done {
	opacity: 0;
	pointer-events: none;
}

/* Light on the water, drifting: two sheets of soft highlights. */
#momo-splash .sea, #momo-splash .sea::after {
	position: absolute;
	inset: -20%;
	content: "";
	pointer-events: none;
	background-image:
		radial-gradient(ellipse 18px 3px at 20% 30%, rgba(255, 255, 255, 0.55), transparent 70%),
		radial-gradient(ellipse 26px 4px at 70% 60%, rgba(255, 255, 255, 0.45), transparent 70%),
		radial-gradient(ellipse 14px 2px at 45% 85%, rgba(255, 255, 255, 0.5), transparent 70%),
		radial-gradient(ellipse 22px 3px at 85% 15%, rgba(255, 255, 255, 0.4), transparent 70%);
	background-size: 180px 140px;
	animation: momo-drift 18s linear infinite;
	opacity: 0.8;
}

#momo-splash .sea::after {
	inset: 0;
	background-size: 260px 210px;
	animation-duration: 27s;
	animation-direction: reverse;
	opacity: 0.6;
}

#momo-splash .float {
	position: relative;
	width: 132px;
	height: 150px;
}

#momo-splash .ripple {
	position: absolute;
	left: 50%;
	bottom: 4px;
	width: 120px;
	height: 18px;
	margin-left: -60px;
	border-radius: 50%;
	background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.15) 62%, transparent 72%);
	animation: momo-ripple 3.2s ease-in-out infinite;
}

#momo-splash .word {
	font-size: clamp(30px, 8vw, 46px);
	font-weight: 800;
	letter-spacing: 0.04em;
	line-height: 1;
	text-shadow: 0 2px 0 rgba(10, 60, 110, 0.22);
}

#momo-splash .line {
	font-size: 15px;
	opacity: 0.94;
	min-height: 1.4em;
	text-shadow: 0 1px 2px rgba(10, 60, 110, 0.35);
}

#momo-splash .dots i {
	font-style: normal;
	animation: momo-dot 1.4s ease-in-out infinite;
}

#momo-splash .dots i:nth-child(2) {
	animation-delay: 0.2s;
}

#momo-splash .dots i:nth-child(3) {
	animation-delay: 0.4s;
}

#momo-splash .bar {
	position: relative;
	width: min(56vw, 240px);
	height: 4px;
	border-radius: 2px;
	overflow: hidden;
	background: rgba(255, 255, 255, 0.3);
}

#momo-splash .bar i {
	position: absolute;
	left: 0;
	top: 0;

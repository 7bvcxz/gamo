<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <!-- Mood board A, "cozy cinema concession": velvet burgundy, brass, marquee bulbs, butter light.
       Hand-written for Popcorn & Glory (Step 15). No source image, no brand. The three-floor layout at 720x1280. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a1424"/><stop offset="1" stop-color="#7a1e2e"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3b8"/><stop offset="1" stop-color="#ecd29a"/></linearGradient>
    <linearGradient id="low" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b1a12"/><stop offset="1" stop-color="#5c2a18"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd76a" stop-opacity="0.75"/><stop offset="1" stop-color="#ffd76a" stop-opacity="0"/></radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3cf6b"/><stop offset="1" stop-color="#b8862b"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#e9f3f6" stop-opacity="0.35"/></linearGradient>
  </defs>
  <!-- top bar -->
  <rect width="720" height="90" fill="#2a0c14"/>
  <circle cx="54" cy="45" r="28" fill="#f6e3b8"/><path d="M62 33 L46 45 L62 57" stroke="#3a1a10" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="300" cy="45" r="22" fill="url(#brass)" stroke="#3a1a10" stroke-width="4"/><text x="334" y="58" font-family="sans-serif" font-size="38" font-weight="700" fill="#f6e3b8">1,240</text>
  <circle cx="600" cy="45" r="28" fill="#f6e3b8"/><circle cx="666" cy="45" r="28" fill="#f6e3b8"/>
  <!-- news icon top right: a folded paper with a red dot -->
  <rect x="650" y="31" width="32" height="26" rx="4" fill="#fff" stroke="#3a1a10" stroke-width="3"/><circle cx="684" cy="30" r="8" fill="#e23b2e"/>
  <rect x="588" y="35" width="24" height="20" rx="3" fill="#3a1a10"/>
  <!-- TOP floor: store -->
  <rect y="90" width="720" height="290" fill="url(#wall)"/>
  <rect x="140" y="104" width="440" height="78" rx="14" fill="#2a0c14" stroke="url(#brass)" stroke-width="6"/>
  <g fill="#ffd76a"><circle cx="160" cy="118" r="6"/><circle cx="200" cy="118" r="6"/><circle cx="240" cy="118" r="6"/><circle cx="280" cy="118" r="6"/><circle cx="320" cy="118" r="6"/><circle cx="360" cy="118" r="6"/><circle cx="400" cy="118" r="6"/><circle cx="440" cy="118" r="6"/><circle cx="480" cy="118" r="6"/><circle cx="520" cy="118" r="6"/><circle cx="560" cy="118" r="6"/>
  <circle cx="160" cy="168" r="6"/><circle cx="200" cy="168" r="6"/><circle cx="240" cy="168" r="6"/><circle cx="280" cy="168" r="6"/><circle cx="320" cy="168" r="6"/><circle cx="360" cy="168" r="6"/><circle cx="400" cy="168" r="6"/><circle cx="440" cy="168" r="6"/><circle cx="480" cy="168" r="6"/><circle cx="520" cy="168" r="6"/><circle cx="560" cy="168" r="6"/></g>
  <!-- marquee picture: a popcorn cup, no words -->
  <path d="M338 128 L382 128 L376 162 L344 162 Z" fill="#fff" stroke="#e23b2e" stroke-width="4"/><path d="M350 128 L352 162 M362 128 L362 162 M372 128 L370 162" stroke="#e23b2e" stroke-width="3"/>
  <g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="346" cy="124" r="9"/><circle cx="360" cy="118" r="10"/><circle cx="374" cy="124" r="9"/></g>
  <!-- counter -->
  <rect x="40" y="300" width="640" height="26" rx="6" fill="url(#brass)"/><rect x="40" y="326" width="640" height="54" fill="#4a1220"/>
  <rect x="90" y="252" width="90" height="48" rx="8" fill="#2a0c14" stroke="url(#brass)" stroke-width="4"/><circle cx="135" cy="276" r="12" fill="#ffd76a"/>
  <!-- customers in line, round friendly shapes -->
  <g stroke="#2a0c14" stroke-width="4">
    <circle cx="300" cy="232" r="26" fill="#f2c9a0"/><path d="M262 300 Q300 240 338 300 Z" fill="#3e8fbf"/>
    <circle cx="390" cy="236" r="24" fill="#d99a6c"/><path d="M354 300 Q390 246 426 300 Z" fill="#7fbf6a"/>
    <circle cx="474" cy="238" r="23" fill="#f6dcc0"/><path d="M440 300 Q474 250 508 300 Z" fill="#e8a33c"/>
    <circle cx="556" cy="240" r="22" fill="#b98055"/><path d="M524 300 Q556 252 588 300 Z" fill="#b06ab3"/>
  </g>
  <path d="M232 206 l18 -12 l4 20 z" fill="#fff" stroke="#e23b2e" stroke-width="3"/>
  <!-- lift between floors (right) -->
  <rect x="640" y="326" width="42" height="610" rx="10" fill="#2a0c14" opacity="0.85"/>
  <g fill="#fff" stroke="#e23b2e" stroke-width="3"><rect x="648" y="420" width="26" height="30" rx="4"/><rect x="648" y="560" width="26" height="30" rx="4"/></g>
  <g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="661" cy="760" r="9"/><circle cx="661" cy="830" r="9"/><circle cx="661" cy="890" r="9"/></g>
  <!-- MIDDLE floor: packing -->
  <rect y="380" width="720" height="280" fill="url(#mid)"/>
  <rect y="380" width="720" height="10" fill="#b8862b"/>
  <!-- raw bin -->
  <path d="M60 470 L190 470 L170 600 L80 600 Z" fill="url(#glass)" stroke="#6b3a1e" stroke-width="5"/>
  <g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="100" cy="580" r="13"/><circle cx="126" cy="575" r="14"/><circle cx="152" cy="580" r="13"/><circle cx="112" cy="556" r="12"/><circle cx="140" cy="554" r="12"/><circle cx="126" cy="534" r="11"/></g>
  <!-- packer with scoop and cup -->
  <rect x="250" y="440" width="200" height="170" rx="20" fill="#e23b2e" stroke="#6b1a12" stroke-width="6"/>
  <rect x="270" y="460" width="160" height="90" rx="12" fill="url(#glass)" stroke="#6b1a12" stroke-width="4"/>
  <path d="M330 560 L370 560 L366 600 L334 600 Z" fill="#fff" stroke="#e23b2e" stroke-width="4"/>
  <path d="M300 470 q40 40 90 10" stroke="url(#brass)" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- shelf with packs -->
  <rect x="490" y="540" width="130" height="14" rx="4" fill="url(#brass)"/>
  <g fill="#fff" stroke="#e23b2e" stroke-width="3"><path d="M500 500 h26 l-3 40 h-20 z"/><path d="M534 500 h26 l-3 40 h-20 z"/><path d="M568 500 h26 l-3 40 h-20 z"/></g>
  <!-- BOTTOM floor: the kettle -->
  <rect y="660" width="720" height="460" fill="url(#low)"/>
  <rect y="660" width="720" height="10" fill="#b8862b"/>
  <circle cx="330" cy="880" r="230" fill="url(#glow)"/>
  <circle cx="330" cy="880" r="175" fill="none" stroke="#3e8fbf" stroke-width="26" stroke-dasharray="560 1200" transform="rotate(-90 330 880)"/>
  <circle cx="330" cy="880" r="175" fill="none" stroke="#ffcf3a" stroke-width="40" stroke-dasharray="180 1200" stroke-dashoffset="-560" transform="rotate(-90 330 880)"/>
  <circle cx="330" cy="880" r="175" fill="none" stroke="#c9301f" stroke-width="26" stroke-dasharray="360 1200" stroke-dashoffset="-740" transform="rotate(-90 330 880)"/>
  <rect x="230" y="760" width="200" height="40" rx="10" fill="#e23b2e" stroke="#6b1a12" stroke-width="5"/>
  <rect x="240" y="800" width="180" height="120" rx="8" fill="url(#glass)" stroke="#6b1a12" stroke-width="5"/>
  <g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="280" cy="900" r="14"/><circle cx="310" cy="895" r="15"/><circle cx="342" cy="900" r="14"/><circle cx="372" cy="896" r="14"/><circle cx="296" cy="872" r="12"/><circle cx="330" cy="870" r="13"/><circle cx="360" cy="874" r="12"/></g>
  <rect x="226" y="920" width="208" height="70" rx="10" fill="#e23b2e" stroke="#6b1a12" stroke-width="5"/>
  <rect x="256" y="944" width="148" height="14" rx="6" fill="url(#brass)"/>
  <!-- auto kettle slots (ghost silhouettes) -->
  <g fill="none" stroke="#f6e3b8" stroke-width="4" stroke-dasharray="10 8" opacity="0.6"><rect x="540" y="760" width="80" height="100" rx="12"/><rect x="540" y="890" width="80" height="100" rx="12"/></g>
  <!-- card -->
  <rect x="40" y="1140" width="640" height="120" rx="24" fill="#f6e3b8" stroke="#b8862b" stroke-width="5"/>
  <circle cx="300" cy="1190" r="18" fill="url(#brass)" stroke="#3a1a10" stroke-width="3"/><text x="326" y="1204" font-family="sans-serif" font-size="40" font-weight="700" fill="#3a1a10">30</text>
  <path d="M600 1224 l0 -48 m-18 18 l18 -18 l18 18" stroke="#3a1a10" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>

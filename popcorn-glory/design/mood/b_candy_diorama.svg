<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1280" viewBox="0 0 720 1280">
  <!-- Mood board B, "candy-coloured industrial diorama": warm butter walls, glossy red machines,
       mint and peach pipes, glass tubes carrying popcorn up, soft drop shadows, one light from the top left.
       Hand-written for Popcorn & Glory (Step 15). No source image, no brand. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c9"/><stop offset="1" stop-color="#fde3a4"/></linearGradient>
    <linearGradient id="floorT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6b0"/><stop offset="1" stop-color="#fbd68a"/></linearGradient>
    <linearGradient id="floorM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdebc4"/><stop offset="1" stop-color="#f7d99e"/></linearGradient>
    <linearGradient id="floorB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe0a8"/><stop offset="1" stop-color="#f3c978"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a55"/><stop offset="1" stop-color="#d6352a"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fe0c4"/><stop offset="0.5" stop-color="#c8f5e4"/><stop offset="1" stop-color="#6fc9aa"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7edf2"/><stop offset="1" stop-color="#a9b6c2"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#dff4ff" stop-opacity="0.4"/></linearGradient>
    <radialGradient id="gold" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe27a" stop-opacity="0.8"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#bg)"/>
  <!-- top bar: floating round buttons, the coin and the news paper top right -->
  <circle cx="54" cy="48" r="30" fill="#fff" stroke="#4d291a" stroke-width="3"/><path d="M62 36 L46 48 L62 60" stroke="#4d291a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="290" cy="48" r="22" fill="#ffc83a" stroke="#4d291a" stroke-width="4"/><text x="322" y="62" font-family="sans-serif" font-size="40" font-weight="700" fill="#4d291a">1,240</text>
  <circle cx="586" cy="48" r="30" fill="#fff" stroke="#4d291a" stroke-width="3"/>
  <circle cx="660" cy="48" r="30" fill="#fff" stroke="#4d291a" stroke-width="3"/><rect x="644" y="36" width="32" height="24" rx="4" fill="#fff" stroke="#4d291a" stroke-width="3"/><path d="M650 44 h20 M650 52 h14" stroke="#4d291a" stroke-width="3"/><circle cx="682" cy="28" r="9" fill="#ff5a4a" stroke="#fff" stroke-width="3"/>
  <!-- TOP: storefront as a diorama shelf -->
  <rect x="20" y="100" width="680" height="270" rx="28" fill="url(#floorT)" stroke="#e8b85a" stroke-width="4"/>
  <rect x="20" y="300" width="680" height="16" fill="#000" opacity="0.06"/>
  <!-- striped awning and a picture sign -->
  <path d="M60 110 h600 v40 q-30 22 -60 0 q-30 22 -60 0 q-30 22 -60 0 q-30 22 -60 0 q-30 22 -60 0 q-30 22 -60 0 q-30 22 -60 0 q-30 22 -60 0 q-30 22 -60 0 q-30 22 -60 0 z" fill="#ff6a55"/>
  <g fill="#fff"><rect x="120" y="110" width="60" height="40"/><rect x="240" y="110" width="60" height="40"/><rect x="360" y="110" width="60" height="40"/><rect x="480" y="110" width="60" height="40"/><rect x="600" y="110" width="60" height="40"/></g>
  <circle cx="110" cy="214" r="38" fill="#fff" stroke="#4d291a" stroke-width="4"/><path d="M94 206 h32 l-5 28 h-22 z" fill="#ff6a55"/><g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="101" cy="202" r="7"/><circle cx="111" cy="198" r="8"/><circle cx="121" cy="202" r="7"/></g>
  <!-- counter with a bag being handed over -->
  <rect x="60" y="262" width="600" height="34" rx="12" fill="url(#red)" stroke="#8a2318" stroke-width="3"/>
  <rect x="60" y="262" width="600" height="8" rx="4" fill="#fff" opacity="0.5"/>
  <path d="M232 226 h28 l-3 36 h-22 z" fill="#fff" stroke="#ff6a55" stroke-width="3"/>
  <g stroke="#4d291a" stroke-width="3.5">
    <circle cx="300" cy="200" r="24" fill="#f6d2ae"/><rect x="276" y="222" width="48" height="40" rx="18" fill="#6fb6e8"/>
    <circle cx="384" cy="204" r="22" fill="#d9a07a"/><rect x="362" y="224" width="44" height="38" rx="16" fill="#8fe0c4"/>
    <circle cx="462" cy="206" r="21" fill="#f8e0c8"/><rect x="441" y="225" width="42" height="37" rx="16" fill="#ffb36b"/>
    <circle cx="538" cy="208" r="20" fill="#b98a66"/><rect x="518" y="226" width="40" height="36" rx="15" fill="#c79ae0"/>
  </g>
  <circle cx="300" cy="166" r="14" fill="#fff" stroke="#4d291a" stroke-width="2.5"/><path d="M294 162 h12 l-2 10 h-8 z" fill="#ff6a55"/>
  <!-- glass tube carrying popcorn up (right) -->
  <rect x="640" y="300" width="40" height="660" rx="20" fill="url(#glass)" stroke="#9fb3c4" stroke-width="4"/>
  <g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="660" cy="420" r="11"/><circle cx="660" cy="520" r="11"/><circle cx="660" cy="680" r="11"/><circle cx="660" cy="760" r="11"/><circle cx="660" cy="880" r="11"/></g>
  <!-- MIDDLE: packing on a mint pipe line -->
  <rect x="20" y="384" width="680" height="270" rx="28" fill="url(#floorM)" stroke="#e8b85a" stroke-width="4"/>
  <rect x="60" y="590" width="560" height="22" rx="11" fill="url(#steel)" stroke="#7d8b97" stroke-width="3"/>
  <g fill="#7d8b97"><circle cx="90" cy="601" r="6"/><circle cx="170" cy="601" r="6"/><circle cx="250" cy="601" r="6"/><circle cx="330" cy="601" r="6"/><circle cx="410" cy="601" r="6"/><circle cx="490" cy="601" r="6"/><circle cx="570" cy="601" r="6"/></g>
  <!-- hopper -->
  <path d="M70 430 h110 l-30 90 h-50 z" fill="url(#glass)" stroke="#9fb3c4" stroke-width="4"/>
  <g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="110" cy="505" r="12"/><circle cx="134" cy="500" r="12"/><circle cx="122" cy="482" r="11"/><circle cx="98" cy="486" r="10"/><circle cx="146" cy="478" r="10"/></g>
  <rect x="100" y="520" width="50" height="40" rx="8" fill="url(#mint)" stroke="#4fa489" stroke-width="3"/>
  <!-- the packer: a rounded red machine with a rotating head -->
  <rect x="250" y="430" width="190" height="150" rx="34" fill="url(#red)" stroke="#8a2318" stroke-width="4"/>
  <circle cx="345" cy="490" r="44" fill="url(#glass)" stroke="#8a2318" stroke-width="4"/>
  <g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="333" cy="498" r="11"/><circle cx="355" cy="494" r="12"/><circle cx="344" cy="478" r="10"/></g>
  <rect x="270" y="560" width="150" height="14" rx="7" fill="#fff" opacity="0.4"/>
  <g fill="#fff" stroke="#ff6a55" stroke-width="3"><path d="M330 558 h30 l-4 30 h-22 z"/></g>
  <!-- shelf -->
  <g fill="#fff" stroke="#ff6a55" stroke-width="3"><path d="M480 540 h26 l-3 46 h-20 z"/><path d="M516 540 h26 l-3 46 h-20 z"/><path d="M552 540 h26 l-3 46 h-20 z"/></g>
  <!-- BOTTOM: the hand kettle, large, with the ring -->
  <rect x="20" y="668" width="680" height="450" rx="28" fill="url(#floorB)" stroke="#e8b85a" stroke-width="4"/>
  <circle cx="330" cy="890" r="230" fill="url(#gold)"/>
  <circle cx="330" cy="890" r="172" fill="none" stroke="#6fb6e8" stroke-width="24" stroke-dasharray="560 1200" transform="rotate(-90 330 890)"/>
  <circle cx="330" cy="890" r="172" fill="none" stroke="#ffc83a" stroke-width="40" stroke-dasharray="180 1200" stroke-dashoffset="-560" transform="rotate(-90 330 890)"/>
  <circle cx="330" cy="890" r="172" fill="none" stroke="#e8483a" stroke-width="24" stroke-dasharray="360 1200" stroke-dashoffset="-740" transform="rotate(-90 330 890)"/>
  <ellipse cx="330" cy="1010" rx="140" ry="20" fill="#000" opacity="0.12"/>
  <rect x="230" y="770" width="200" height="38" rx="14" fill="url(#red)" stroke="#8a2318" stroke-width="4"/>
  <rect x="242" y="808" width="176" height="118" rx="14" fill="url(#glass)" stroke="#8a2318" stroke-width="4"/>
  <g fill="#fff8ec" stroke="#d9a441" stroke-width="2"><circle cx="282" cy="904" r="14"/><circle cx="312" cy="898" r="15"/><circle cx="344" cy="904" r="14"/><circle cx="374" cy="900" r="14"/><circle cx="298" cy="876" r="12"/><circle cx="332" cy="874" r="13"/><circle cx="362" cy="878" r="12"/></g>
  <rect x="226" y="926" width="208" height="70" rx="16" fill="url(#red)" stroke="#8a2318" stroke-width="4"/>
  <rect x="256" y="950" width="148" height="12" rx="6" fill="#ffc83a"/>
  <!-- auto kettle slots: dashed mint silhouettes -->
  <g fill="#ffffff" fill-opacity="0.35" stroke="#4fa489" stroke-width="4" stroke-dasharray="10 8"><rect x="540" y="770" width="84" height="104" rx="18"/><rect x="540" y="900" width="84" height="104" rx="18"/></g>
  <!-- card -->
  <rect x="40" y="1140" width="640" height="120" rx="28" fill="#fff" stroke="#e8b85a" stroke-width="4"/>
  <rect x="40" y="1236" width="640" height="24" rx="12" fill="#ffc83a" opacity="0.6"/>
  <circle cx="300" cy="1192" r="18" fill="#ffc83a" stroke="#4d291a" stroke-width="3"/><text x="326" y="1206" font-family="sans-serif" font-size="40" font-weight="700" fill="#4d291a">30</text>
  <path d="M600 1226 l0 -48 m-18 18 l18 -18 l18 18" stroke="#e8483a" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>

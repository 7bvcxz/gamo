    <circle cx="410" cy="170" r="21" fill="#d9a07a"/><rect x="389" y="189" width="42" height="25" rx="12" fill="#8fe0c4"/>
    <circle cx="488" cy="172" r="20" fill="#f8e0c8"/><rect x="468" y="190" width="40" height="24" rx="12" fill="#ffb36b"/>
    <circle cx="564" cy="174" r="19" fill="#b98a66"/><rect x="545" y="191" width="38" height="23" rx="11" fill="#c79ae0"/>

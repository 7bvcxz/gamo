<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <!-- Direction B (chosen), desktop 1280x800: the three floors stacked on the left at full height,
       the floor's upgrade and the machine slots on the right; the news paper top right.
       Hand-written for Popcorn & Glory (Step 15). No source image, no brand. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1c9"/><stop offset="1" stop-color="#fde3a4"/></linearGradient>
    <linearGradient id="fT" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6b0"/><stop offset="1" stop-color="#fbd68a"/></linearGradient>
    <linearGradient id="fM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdebc4"/><stop offset="1" stop-color="#f7d99e"/></linearGradient>
    <linearGradient id="fB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe0a8"/><stop offset="1" stop-color="#f3c978"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a55"/><stop offset="1" stop-color="#d6352a"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7edf2"/><stop offset="1" stop-color="#a9b6c2"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="1" stop-color="#dff4ff" stop-opacity="0.4"/></linearGradient>
    <radialGradient id="gold" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe27a" stop-opacity="0.8"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <!-- top bar -->
  <circle cx="44" cy="40" r="26" fill="#fff" stroke="#4d291a" stroke-width="3"/><path d="M51 30 L37 40 L51 50" stroke="#4d291a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="560" cy="40" r="20" fill="#ffc83a" stroke="#4d291a" stroke-width="4"/>
  <rect x="590" y="26" width="120" height="28" rx="6" fill="#4d291a" opacity="0.12"/>
  <circle cx="1150" cy="40" r="26" fill="#fff" stroke="#4d291a" stroke-width="3"/>
  <circle cx="1220" cy="40" r="26" fill="#fff" stroke="#4d291a" stroke-width="3"/><rect x="1206" y="30" width="28" height="21" rx="4" fill="#fff" stroke="#4d291a" stroke-width="3"/><circle cx="1240" cy="22" r="8" fill="#ff5a4a" stroke="#fff" stroke-width="3"/>
  <!-- left: three floors -->

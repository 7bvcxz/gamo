  <circle cx="330" cy="634" r="160" fill="url(#gold)"/>
  <circle cx="330" cy="634" r="128" fill="none" stroke="#6fb6e8" stroke-width="22" stroke-dasharray="420 900" transform="rotate(-90 330 634)"/>
  <circle cx="330" cy="634" r="128" fill="none" stroke="#ffc83a" stroke-width="36" stroke-dasharray="130 900" stroke-dashoffset="-420" transform="rotate(-90 330 634)"/>
  <circle cx="330" cy="634" r="128" fill="none" stroke="#e8483a" stroke-width="22" stroke-dasharray="254 900" stroke-dashoffset="-550" transform="rotate(-90 330 634)"/>
  <rect x="258" y="560" width="144" height="28" rx="12" fill="url(#red)" stroke="#8a2318" stroke-width="4"/>
  <rect x="266" y="588" width="128" height="84" rx="12" fill="url(#glass)" stroke="#8a2318" stroke-width="4"/>
  <rect x="254" y="672" width="152" height="52" rx="14" fill="url(#red)" stroke="#8a2318" stroke-width="4"/>
  <g fill="#ffffff" fill-opacity="0.35" stroke="#6fb6e8" stroke-width="4" stroke-dasharray="10 8"><rect x="540" y="520" width="80" height="100" rx="16"/><rect x="640" y="520" width="80" height="100" rx="16"/><rect x="540" y="650" width="80" height="100" rx="16"/><rect x="640" y="650" width="80" height="100" rx="16"/></g>
  <rect x="746" y="200" width="30" height="460" rx="15" fill="url(#glass)" stroke="#9fb3c4" stroke-width="3"/>

  <path d="M60 90 h680 v30 q-34 18 -68 0 q-34 18 -68 0 q-34 18 -68 0 q-34 18 -68 0 q-34 18 -68 0 q-34 18 -68 0 q-34 18 -68 0 q-34 18 -68 0 q-34 18 -68 0 q-34 18 -68 0 z" fill="#ff6a55"/>
  <rect x="60" y="214" width="640" height="28" rx="12" fill="url(#red)" stroke="#8a2318" stroke-width="3"/>

  <rect x="840" y="110" width="110" height="130" rx="16" fill="url(#red)" stroke="#8a2318" stroke-width="3"/>
  <circle cx="1000" cy="150" r="18" fill="#ffc83a" stroke="#4d291a" stroke-width="3"/><rect x="1028" y="138" width="120" height="26" rx="6" fill="#4d291a" opacity="0.15"/>
  <rect x="980" y="190" width="200" height="20" rx="6" fill="#4d291a" opacity="0.1"/>
  <path d="M1220 214 l0 -44 m-16 16 l16 -16 l16 16" stroke="#e8483a" stroke-width="7" fill="none" stroke-linecap="round"/>
  <rect x="810" y="290" width="450" height="494" rx="26" fill="#fff" fill-opacity="0.6" stroke="#e8b85a" stroke-width="4"/>
  <g fill="#ffffff" stroke="#6fb6e8" stroke-width="3"><rect x="840" y="320" width="120" height="120" rx="18"/><rect x="975" y="320" width="120" height="120" rx="18"/><rect x="1110" y="320" width="120" height="120" rx="18"/>
  <rect x="840" y="460" width="120" height="120" rx="18"/><rect x="975" y="460" width="120" height="120" rx="18" stroke-dasharray="10 8"/><rect x="1110" y="460" width="120" height="120" rx="18" stroke-dasharray="10 8"/></g>
  <g fill="#8fe0c4" stroke="#4fa489" stroke-width="3"><rect x="870" y="345" width="60" height="70" rx="12"/><rect x="1005" y="345" width="60" height="70" rx="12"/><rect x="1140" y="345" width="60" height="70" rx="12"/><rect x="870" y="485" width="60" height="70" rx="12"/></g>
</svg>

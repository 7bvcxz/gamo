  <g fill="#e6d8bc"><circle cx="80" cy="140" r="3"/><circle cx="410" cy="260" r="2"/><circle cx="620" cy="520" r="3"/><circle cx="160" cy="720" r="2"/><circle cx="520" cy="1060" r="3"/><circle cx="300" cy="610" r="2"/><circle cx="660" cy="190" r="2"/></g>

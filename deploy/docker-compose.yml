# One nginx serving the built site. No database, no application server.
#
# Named gamo-gateway and listening on 8088 to match the other five services on
# this machine's Cloudflare tunnel, which all answer at <name>-gateway:8088. The
# port is arbitrary inside a container network -- what it buys is that every
# public hostname in the tunnel dashboard reads the same way, so none of them is
# the one you have to remember differently.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# It joins the network the HeyDive stack already runs on so that the existing
# Cloudflare tunnel can reach it by container name. The tunnel is token-based,
# which means its public hostnames live in the Cloudflare dashboard rather than
# in any file here -- see deploy/README.md for the one manual step.

services:
  gamo-gateway:
    image: nginx:1.27-alpine
    container_name: gamo-gateway
    restart: unless-stopped
    volumes:
      # Read-only, and deliberately not the repository's docs/ directory. The
      # publish script copies into this one, so a half-finished build is never
      # live and the .gz files it generates never land in the working tree.
      - ${GAMO_SERVE_ROOT:-/home/merti/srv/gamo}:/srv/gamo:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Local only. Public traffic arrives through the tunnel, not this port; it
      # exists so a deploy can be checked before anyone else sees it. The host
      # side is 8090 because 8088 is already HAProxy's and 8089 is kortrip's --
      # inside the container there is no such clash.
      - "127.0.0.1:8090:8088"
    networks:
      - heydive

networks:
  heydive:
    external: true
    name: heydive-server_default

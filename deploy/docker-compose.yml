# One nginx serving the built site. No database, no application server.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# It joins the network the HeyDive stack already runs on so that the existing
# Cloudflare tunnel can reach it by container name. The tunnel is token-based,
# which means its public hostnames live in the Cloudflare dashboard rather than
# in any file here -- see deploy/README.md for the one manual step.

services:
  gamo-web:
    image: nginx:1.27-alpine
    container_name: gamo-web
    restart: unless-stopped
    volumes:
      # Read-only, and deliberately not the repository's docs/ directory. The
      # publish script copies into this one, so a half-finished build is never
      # live and the .gz files it generates never land in the working tree.
      - ${GAMO_SERVE_ROOT:-/home/merti/srv/gamo}:/srv/gamo:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Local only. Public traffic arrives through the tunnel, not this port; it
      # exists so a deploy can be checked before anyone else sees it. 8090 was
      # free -- 8088 and 8089 are HAProxy and kortrip.
      - "127.0.0.1:8090:80"
    networks:
      - heydive

networks:
  heydive:
    external: true
    name: heydive-server_default

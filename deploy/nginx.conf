# Serves the built site from this machine instead of GitHub Pages.
#
# The reason this exists: Pages decides when a push becomes visible and how long
# it stays cached, and neither is negotiable. On 2026-08-06 a push took over four
# hours to appear while the file it replaced kept being served, and the ten
# minute cache meant a corrected image stayed wrong for another ten after that.
# Nothing about the site needs a build service -- it is 77 static files -- so the
# only thing being bought back here is control over those two numbers.
#
# What is deliberately NOT here: any application server. There is not one call to
# fetch or /api in the whole of web/src. Adding Next.js or Spring Boot would put
# a runtime in front of files that have no dynamic parts.

# Cache policy by filename, decided once instead of repeated per location.
# The quotes are load-bearing: nginx reads a bare { as the start of a block, so
# a regex containing {8,} is a syntax error without them.
map $uri $gamo_cache {
    default                                                   "public, max-age=300";

    # A name carrying a content hash can be cached forever, because changing the
    # bytes changes the URL. Packs, bundles and sprite sheets in this repository
    # are all named this way already.
    "~*-[A-Za-z0-9_-]{8,}\.(wasm|pck|js|css|png|mp4|woff2)$"   "public, max-age=31536000, immutable";

    # Everything a browser reads to discover those hashed names. If any of this
    # is cached the scheme inverts, and stale HTML points at files that are gone.
    # This is the header Pages would not let us set.
    "~*\.(html|json)$"                                         "no-cache";
}

server {
    listen 8088;
    server_name _;

    root /srv/gamo;

    # The site is built with base '/gamo/' so it can live under a project path on
    # Pages. Keeping that base means both hosts serve identical files and either
    # can be switched off without a rebuild.
    location = / { return 302 /gamo/; }

    # No types block here, and that is the fix rather than an omission. A types
    # block replaces the inherited map instead of extending it, so declaring
    # wasm and pck cost every other type in the file: index.html went out as
    # application/octet-stream, which a browser downloads rather than renders.
    # nginx 1.27's own mime.types already carries `application/wasm wasm`, and
    # .pck is absent there, so it falls to default_type octet-stream -- which is
    # what a Godot pack should be anyway. Both wanted types come for free.

    location /gamo/ {
        alias /srv/gamo/;
        try_files $uri $uri/ =404;
        index index.html;

        # Serve the .gz built at publish time. The engine is 37.7MB raw and
        # 10.2MB gzipped, which is what Pages sends; compressing that per request
        # would burn CPU on every cold load and it never changes between
        # deploys. gzip_static hands over the pre-made file with no work at all.
        gzip_static on;

        # always, so it is set on 304s too -- a revalidated response that arrives
        # without a cache header is how a "no-cache" file quietly becomes cached.
        add_header Cache-Control $gamo_cache always;
    }

    # The games are embedded in HeyDive through an iframe, so nothing here may
    # set X-Frame-Options or a frame-ancestors policy.

    access_log /var/log/nginx/gamo.access.log;
}

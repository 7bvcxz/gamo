# Popcorn & Glory only. The path filter means a change outside popcorn-glory/ never starts
# this workflow, and this workflow never touches another game.
#
# Import, the editor load check, and the headless unit + integration tests on every change,
# and once a week on a schedule (Step 46: a suite nobody runs rots -- AGENTS.md). The log is
# kept as an artifact. The browser suite (popcorn-glory/tools/test_all.sh: --focused, full,
# --slow, --perf, --public) runs on the development machine: it needs the shared engine in
# docs/ and the full run is hours long.
name: popcorn-glory

on:
  push:
    branches: [main]
    paths: ['popcorn-glory/**', '.github/workflows/popcorn-glory.yml']
  pull_request:
    paths: ['popcorn-glory/**', '.github/workflows/popcorn-glory.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC

concurrency:
  group: popcorn-glory-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # (Step 46: the headless suite is about 11 minutes here)
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            popcorn-glory
            .github
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - run: echo "$HOME/godot" >> "$GITHUB_PATH"
      - run: godot --version
      - name: Import, load check, unit + integration
        run: popcorn-glory/tools/check.sh 2>&1 | tee popcorn-check.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-check-${{ github.sha }}
          path: popcorn-check.log
          retention-days: 14

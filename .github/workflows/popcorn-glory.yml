# Popcorn & Glory only. The path filter means a change outside popcorn-glory/ never starts
# this workflow, and this workflow never touches another game.
#
# Import, the editor load check, and the headless unit + integration tests on every change.
# The browser suite (popcorn-glory/tools/test_all.sh) is run on the development machine:
# it needs the shared engine in docs/ and is minutes long.
name: popcorn-glory

on:
  push:
    branches: [main]
    paths: ['popcorn-glory/**', '.github/workflows/popcorn-glory.yml']
  pull_request:
    paths: ['popcorn-glory/**', '.github/workflows/popcorn-glory.yml']
  workflow_dispatch:

concurrency:
  group: popcorn-glory-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7-stable

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            popcorn-glory
            .github
      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux
      - name: Download Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv /tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
      - run: echo "$HOME/godot" >> "$GITHUB_PATH"
      - run: godot --version
      - name: Import, load check, unit + integration
        run: popcorn-glory/tools/check.sh

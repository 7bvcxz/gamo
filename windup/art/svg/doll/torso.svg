<svg xmlns="http://www.w3.org/2000/svg" width="52" height="64" viewBox="0 0 52 64">
  <!-- Torso, facing right. Neck at (26,4), shoulder joint at (24,12),
       hip joint at (26,60). Back key sockets on the left edge. -->
  <defs>
    <linearGradient id="vest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4e1c26"/>
      <stop offset="0.6" stop-color="#7a2e3a"/>
      <stop offset="1" stop-color="#93404c"/>
    </linearGradient>
  </defs>
  <!-- shirt -->
  <path d="M10 10 C 16 4, 36 4, 42 10 L 44 58 C 34 63, 18 63, 8 58 Z" fill="#efe3cc" stroke="#3a2618" stroke-width="2.5"/>
  <!-- waistcoat over it, open at the front (right) -->
  <path d="M9 12 C 14 7, 26 7, 32 9 L 36 60 C 26 63, 16 62, 8 58 Z" fill="url(#vest)" stroke="#3a2618" stroke-width="2.5"/>
  <circle cx="33" cy="26" r="2.6" fill="#e6b450" stroke="#5a3812" stroke-width="1"/>
  <circle cx="34" cy="36" r="2.6" fill="#e6b450" stroke="#5a3812" stroke-width="1"/>
  <circle cx="35" cy="46" r="2.6" fill="#e6b450" stroke="#5a3812" stroke-width="1"/>
  <!-- tape measure around the neck, hanging down the front -->
  <path d="M14 9 C 22 14, 32 14, 40 9" fill="none" stroke="#f2c64a" stroke-width="4" stroke-linecap="round"/>
  <path d="M39 10 L 41 30" fill="none" stroke="#f2c64a" stroke-width="4" stroke-linecap="round"/>
  <path d="M39 14 L 42 14 M 39.5 19 L 42.5 19 M 40 24 L 43 24" stroke="#8a6a1a" stroke-width="1"/>
  <!-- belt line -->
  <path d="M8 54 C 18 58, 34 58, 44 54" fill="none" stroke="#3a2618" stroke-width="2"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <!-- The dormant atelier (Windup). Original art, 2026-11-03.
       The game's 1280x720 design rectangle sits at (80,120); the key's axis is
       at (720,500), the bench top at y=612, the floor from y=600 down.
       Nothing that the game draws itself (the key, the dolls, the spirit) is in
       this picture. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1724"/>
      <stop offset="1" stop-color="#2d2437"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e221c"/>
      <stop offset="1" stop-color="#1d1511"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5f8e"/>
      <stop offset="1" stop-color="#28344f"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c9d8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c9d8ff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6eeff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e6eeff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c1520"/>
      <stop offset="0.25" stop-color="#4a2232"/>
      <stop offset="0.5" stop-color="#2f1722"/>
      <stop offset="0.75" stop-color="#45202f"/>
      <stop offset="1" stop-color="#26121c"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4130"/>
      <stop offset="1" stop-color="#3a2a20"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#05040a" stop-opacity="0.6"/>
    </radialGradient>
    <pattern id="stripes" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="none"/>
      <rect x="0" width="18" height="48" fill="#ffffff" opacity="0.025"/>
      <circle cx="33" cy="24" r="3" fill="#ffffff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- wall, wallpaper, crown moulding -->
  <rect width="1440" height="600" fill="url(#wall)"/>
  <rect width="1440" height="440" fill="url(#stripes)"/>
  <rect width="1440" height="26" fill="#140f18"/>
  <rect y="26" width="1440" height="6" fill="#2a2030"/>

  <!-- wainscoting -->
  <rect y="440" width="1440" height="160" fill="#231a22"/>
  <rect y="436" width="1440" height="8" fill="#33262f"/>
  <g fill="none" stroke="#2f2330" stroke-width="3">
    <rect x="20" y="462" width="200" height="112" rx="4"/>
    <rect x="250" y="462" width="200" height="112" rx="4"/>
    <rect x="480" y="462" width="200" height="112" rx="4"/>
    <rect x="760" y="462" width="200" height="112" rx="4"/>
    <rect x="990" y="462" width="200" height="112" rx="4"/>
    <rect x="1220" y="462" width="200" height="112" rx="4"/>
  </g>
  <rect y="590" width="1440" height="14" fill="#160f14"/>

  <!-- floor -->
  <rect y="604" width="1440" height="356" fill="url(#floor)"/>
  <g stroke="#1a120e" stroke-width="3">
    <line x1="0" y1="640" x2="1440" y2="640"/>
    <line x1="0" y1="688" x2="1440" y2="688"/>
    <line x1="0" y1="748" x2="1440" y2="748"/>
    <line x1="0" y1="822" x2="1440" y2="822"/>
    <line x1="0" y1="908" x2="1440" y2="908"/>
  </g>
  <g stroke="#1a120e" stroke-width="2">
    <line x1="180" y1="604" x2="180" y2="640"/><line x1="610" y1="604" x2="610" y2="640"/><line x1="1050" y1="604" x2="1050" y2="640"/>
    <line x1="90" y1="640" x2="90" y2="688"/><line x1="470" y1="640" x2="470" y2="688"/><line x1="930" y1="640" x2="930" y2="688"/><line x1="1320" y1="640" x2="1320" y2="688"/>
    <line x1="260" y1="688" x2="260" y2="748"/><line x1="760" y1="688" x2="760" y2="748"/><line x1="1190" y1="688" x2="1190" y2="748"/>
    <line x1="120" y1="748" x2="120" y2="822"/><line x1="560" y1="748" x2="560" y2="822"/><line x1="1010" y1="748" x2="1010" y2="822"/>
    <line x1="330" y1="822" x2="330" y2="908"/><line x1="850" y1="822" x2="850" y2="908"/><line x1="1290" y1="822" x2="1290" y2="908"/>
  </g>

  <!-- the window and the moon -->
  <path d="M168 484 L168 250 A 102 102 0 0 1 372 250 L372 484 Z" fill="#3a2b2c"/>
  <path d="M184 470 L184 252 A 86 86 0 0 1 356 252 L356 470 Z" fill="url(#glass)"/>
  <circle cx="300" cy="236" r="70" fill="url(#moonglow)"/>
  <circle cx="300" cy="236" r="30" fill="#e3ebff"/>
  <circle cx="290" cy="230" r="6" fill="#c9d4ee" opacity="0.7"/><circle cx="310" cy="246" r="4" fill="#c9d4ee" opacity="0.7"/>
  <g stroke="#3a2b2c" stroke-width="8">
    <line x1="270" y1="166" x2="270" y2="470"/>
    <line x1="184" y1="330" x2="356" y2="330"/>
  </g>
  <rect x="156" y="470" width="228" height="16" rx="3" fill="#47363a"/>

  <!-- moonlight on the floor -->
  <path d="M184 486 L356 486 L760 960 L330 960 Z" fill="url(#beam)"/>
  <g fill="#e6eeff" opacity="0.35">
    <circle cx="300" cy="560" r="1.6"/><circle cx="352" cy="610" r="1.2"/><circle cx="270" cy="640" r="1.4"/>
    <circle cx="420" cy="700" r="1.8"/><circle cx="390" cy="770" r="1.2"/><circle cx="520" cy="820" r="1.5"/>
  </g>

  <!-- shelves of fabric bolts and spools -->
  <g>
    <rect x="410" y="248" width="230" height="10" fill="#3b2a22"/>
    <rect x="410" y="350" width="230" height="10" fill="#3b2a22"/>
    <g stroke="#140e10" stroke-width="2">
      <rect x="420" y="198" width="40" height="50" rx="8" fill="#5a2a35"/>
      <rect x="464" y="208" width="36" height="40" rx="8" fill="#6f6040"/>
      <rect x="504" y="192" width="42" height="56" rx="8" fill="#3d4760"/>
      <rect x="550" y="206" width="38" height="42" rx="8" fill="#6b5f52"/>
      <rect x="430" y="300" width="48" height="50" rx="8" fill="#47304a"/>
      <rect x="482" y="310" width="40" height="40" rx="8" fill="#5f3a2c"/>
      <rect x="528" y="320" width="16" height="30" rx="3" fill="#7a6a4e"/>
      <rect x="548" y="320" width="16" height="30" rx="3" fill="#5a2a35"/>
      <rect x="568" y="320" width="16" height="30" rx="3" fill="#3d4760"/>
      <rect x="592" y="304" width="40" height="46" rx="8" fill="#584c5e"/>
    </g>
  </g>

  <!-- the covered sewing machine on its little table -->
  <g>
    <rect x="410" y="546" width="190" height="14" rx="3" fill="url(#wood)"/>
    <rect x="422" y="560" width="12" height="130" fill="#2c2019"/>
    <rect x="576" y="560" width="12" height="130" fill="#2c2019"/>
    <!-- The sewing machine (covered while the atelier sleeps, uncovered from stage 2) is drawn by the game. -->
  </g>

  <!-- dress form with a half-finished jacket -->
  <g>
    <rect x="1036" y="520" width="8" height="140" fill="#2a1e18"/>
    <path d="M1000 690 L1040 650 L1080 690" fill="none" stroke="#2a1e18" stroke-width="7" stroke-linecap="round"/>
    <path d="M996 400 C 1000 372, 1080 372, 1084 400 C 1088 440, 1074 470, 1078 524 C 1060 532, 1020 532, 1002 524 C 1006 470, 992 440, 996 400 Z" fill="#6b5a4c" stroke="#231812" stroke-width="2"/>
    <path d="M996 404 C 1000 380, 1040 376, 1040 380 L 1038 528 C 1024 530, 1012 528, 1002 524 C 1006 470, 992 440, 996 404 Z" fill="#3e4a5e" stroke="#1c2230" stroke-width="2"/>
    <path d="M1040 380 L 1030 430 L 1040 460" fill="none" stroke="#2a3344" stroke-width="2"/>
    <g fill="#c8c0b0"><circle cx="1052" cy="420" r="2"/><circle cx="1056" cy="440" r="2"/><circle cx="1050" cy="462" r="2"/></g>
    <rect x="1028" y="362" width="24" height="14" rx="4" fill="#3a2a22"/>
  </g>

  <!-- the stopped grandfather clock -->
  <g>
    <path d="M1172 270 L1172 236 C 1172 214, 1298 214, 1298 236 L1298 270 Z" fill="#3a251f" stroke="#160d0a" stroke-width="2"/>
    <rect x="1178" y="268" width="114" height="350" fill="#3a251f" stroke="#160d0a" stroke-width="2"/>
    <rect x="1168" y="606" width="134" height="22" fill="#2e1d18"/>
    <circle cx="1235" cy="318" r="40" fill="#c9bea2" stroke="#7a5a26" stroke-width="5"/>
    <circle cx="1235" cy="318" r="40" fill="#1c1724" opacity="0.35"/>
    <g stroke="#2a1d14" stroke-width="4" stroke-linecap="round"><line x1="1235" y1="318" x2="1218" y2="300"/><line x1="1235" y1="318" x2="1254" y2="296"/></g>
    <rect x="1206" y="384" width="58" height="190" rx="6" fill="#1e1416"/>
    <line x1="1235" y1="390" x2="1235" y2="520" stroke="#6e4b22" stroke-width="3"/>
    <circle cx="1235" cy="526" r="16" fill="#8a6428" stroke="#4a2e10" stroke-width="2"/>
  </g>

  <!-- curtains drawn shut on the right -->
  <rect x="1316" y="34" width="124" height="566" fill="url(#curtain)"/>
  <rect x="1306" y="30" width="134" height="12" rx="4" fill="#5a4022"/>
  <path d="M1316 600 C 1340 584, 1380 584, 1440 600 L1440 616 L1316 616 Z" fill="#2a1420"/>

  <!-- workbench and the key's mount -->
  <g>
    <!-- The big gear behind the key is drawn by the game (assets/art/gear_big.svg) so it can turn. -->
    <rect x="708" y="540" width="24" height="76" fill="#6e4b22" stroke="#2a1a0c" stroke-width="2"/>
    <rect x="530" y="610" width="380" height="26" rx="4" fill="url(#wood)" stroke="#1e140e" stroke-width="2"/>
    <rect x="530" y="610" width="380" height="5" fill="#6e5038"/>
    <rect x="552" y="636" width="22" height="118" fill="#3a2a20"/>
    <rect x="866" y="636" width="22" height="118" fill="#3a2a20"/>
    <rect x="600" y="638" width="240" height="40" rx="3" fill="#33251c" stroke="#1e140e" stroke-width="2"/>
    <circle cx="720" cy="658" r="5" fill="#8a6428"/>
    <g fill="none" stroke="#9a8f80" stroke-width="3" stroke-linecap="round">
      <path d="M560 606 L600 594"/><path d="M560 598 L600 604"/>
    </g>
    <g fill="#a08f78"><circle cx="556" cy="606" r="4"/><circle cx="556" cy="597" r="4"/></g>
    <rect x="852" y="588" width="18" height="22" rx="3" fill="#5a2a35" stroke="#1e140e" stroke-width="1.5"/>
    <rect x="848" y="586" width="26" height="5" fill="#7a5a3a"/><rect x="848" y="607" width="26" height="5" fill="#7a5a3a"/>
  </g>

  <!-- the unlit chandelier, dusty -->
  <g>
    <line x1="720" y1="0" x2="720" y2="112" stroke="#4a3a28" stroke-width="4"/>
    <ellipse cx="720" cy="140" rx="112" ry="22" fill="none" stroke="#6e5428" stroke-width="7"/>
    <path d="M720 112 L620 140 M720 112 L820 140 M720 112 L720 160" stroke="#5a4422" stroke-width="3"/>
    <g fill="#cfc4ae" stroke="#5a4a38" stroke-width="1.5">
      <rect x="604" y="112" width="12" height="26" rx="2"/><rect x="664" y="104" width="12" height="28" rx="2"/>
      <rect x="764" y="104" width="12" height="28" rx="2"/><rect x="824" y="112" width="12" height="26" rx="2"/>
    </g>
    <path d="M610 160 C 640 172, 660 168, 676 162 M764 162 C 780 168, 800 172, 830 160" fill="none" stroke="#9a9488" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- cobwebs -->
  <g fill="none" stroke="#a9a3b4" stroke-width="1" opacity="0.28">
    <path d="M32 32 L130 32 M32 32 L32 130 M32 32 L110 110 M32 32 L72 128 M32 32 L128 72"/>
    <path d="M60 32 C 60 46, 46 60, 32 60 M88 32 C 88 60, 60 88, 32 88 M116 32 C 116 74, 74 116, 32 116"/>
    <path d="M1316 34 L1240 34 M1316 34 L1260 96 M1316 34 L1290 110"/>
    <path d="M1272 34 C 1276 50, 1290 66, 1306 70"/>
  </g>

  <rect width="1440" height="960" fill="url(#vignette)"/>
</svg>
